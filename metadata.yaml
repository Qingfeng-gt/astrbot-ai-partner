name: astrbot_plugin_hanhan
display_name: 憨憨人格
short_desc: 把前任"憨憨"蒸馏成 AstrBot 人格——迂回、学习优先、深夜语音的大学同班前任
desc: |
  自包含的 AstrBot 人格插件：把 /create-ex skill 生成的前任人格浓缩为单一 md 提示词，以憨憨的身份与记忆回复。

  ## 功能
  - 通过 on_llm_request 钩子把人格提示词注入 req.system_prompt，所有 LLM 回复均以憨憨身份进行
  - 人格内容：关系记忆（算法课相识、图书馆陪学、深夜语音、分手后分享）+ 人物性格（迂回表达、学习优先、回避直球情感问题）
  - 支持命令：
    - /憨憨开关 —— 按会话切换人格开关
    - /憨憨状态 —— 查看当前会话开关状态
    - /憨憨主动 —— 切换主动消息开关（私聊自动绑定）
    - /憨憨主动状态 —— 查看调度与已发状态
    - /憨憨主动测试 [night|day] —— 预览主动消息内容
  - 人格提示词在 persona/persona_prompt.md（单一 md），可直接编辑

  ## 安装
  将本文件夹复制到 AstrBot 插件目录（data/plugins/ 或 addons/），或在 WebUI 插件管理安装本压缩包，然后重载插件。

  ## 图片识别（可选）
  在插件配置里填入百炼 API Key 后，用户发图片时憨憨能"看到"图片内容并自然回应（识别走百炼多模态，对话仍走原模型）。配置项见插件目录下的 _conf_schema.json。
